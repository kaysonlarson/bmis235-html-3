<script>
  function showIngredients() {
    const summary = document.getElementById("basket-summary");
    let ingredients = [];

    try {
      const saved = JSON.parse(
        localStorage.getItem("fridge-raid-ingredients-v1") || "[]"
      );
      if (Array.isArray(saved)) ingredients = saved;
    } catch {}

    summary.textContent = ingredients.length
      ? "In your bin: " + ingredients.join(", ")
      : "Your bin is empty. Open the fridge and pick some ingredients.";
  }

  window.addEventListener("pageshow", showIngredients);
</script>
