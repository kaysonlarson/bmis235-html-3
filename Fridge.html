<h1>My Fridge</h1>

<!-- Footer: fill in your name -->

<script>
  const fridgeKey = "fridge-raid-ingredients-v1";
  const boxes = document.querySelectorAll('input[type="checkbox"][value]');

  function readBin() {
    try {
      const saved = JSON.parse(localStorage.getItem(fridgeKey) || "[]");
      return new Set(Array.isArray(saved) ? saved : []);
    } catch {
      return new Set();
    }
  }

  function foodName(box) {
    // Match the game's names: "ground-beef" becomes "Ground beef".
    const name = box.value.replaceAll("-", " ").toLowerCase();
    return name.charAt(0).toUpperCase() + name.slice(1);
  }

  function syncChecklist() {
    const bin = readBin();
    boxes.forEach(box => {
      box.checked = bin.has(foodName(box));
    });
  }

  boxes.forEach(box => {
    box.addEventListener("change", () => {
      const bin = readBin();
      const name = foodName(box);
      if (box.checked) bin.add(name);
      else bin.delete(name);
     try {
  localStorage.setItem(fridgeKey, JSON.stringify([...bin]));
  const saved = [...readBin()];
  document.querySelector("h1 + p").textContent =
    saved.length ? "Saved in your bin: " + saved.join(", ") : "Your bin is empty.";
} catch {
  document.querySelector("h1 + p").textContent =
    "Your browser couldn't save this selection.";
}
    });
  });
  window.addEventListener("pageshow", syncChecklist);
  window.addEventListener("storage", syncChecklist);
</script>
